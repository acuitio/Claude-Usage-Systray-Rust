name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # Note: cargo fmt --check is intentionally not run. The codebase uses a
      # deliberately compact style (single-line short fns, multi-field-per-line
      # struct literals) that rustfmt's defaults would expand. Plan to add the
      # reformat + a tuned rustfmt.toml as a "prep for publish" step later.

      - name: Clippy
        run: cargo clippy --all-targets --release -- -D warnings

      - name: Build (release)
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Upload release exe
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeUsageSystray-${{ github.sha }}
          path: target/release/ClaudeUsageSystray.exe
          if-no-files-found: error
