<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Usage Chart</title>
<style>
  :root {
    --bg:        #1a1a2e;
    --surface:   #1e1e1e;
    --border:    #333333;
    --fg:        #ffffff;
    --fg-dim:    #b0b0b0;
    --fg-faint:  #888888;
    --grid:      #2d3340;
    --session:   #3fb950;
    --weekly:    #e6c832;
    --fable:     #f85149;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    height: 100%; width: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    font-size: 13px;
    overflow: hidden;
  }
  .container {
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 14px 18px;
    gap: 8px;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  h2 {
    margin: 0;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.1px;
  }
  /* Segmented range selector. */
  .ranges {
    display: inline-flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px;
    gap: 2px;
  }
  .ranges button {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--fg-dim);
    font: inherit;
    font-size: 12px;
    line-height: 1;
    padding: 5px 10px;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.12s, color 0.12s;
  }
  .ranges button:hover { color: var(--fg); }
  .ranges button.active {
    background: var(--weekly);
    color: #1a1a2e;
    font-weight: 600;
  }
  .legend {
    display: flex;
    gap: 14px;
    font-size: 12px;
    color: var(--fg-dim);
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .swatch {
    width: 12px; height: 12px;
    border-radius: 2px;
  }
  .swatch.session { background: var(--session); }
  .swatch.weekly  { background: var(--weekly); }
  .swatch.fable   { background: var(--fable); }

  .canvas-wrap {
    position: relative;
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
  }
  canvas { display: block; }
  #empty {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    color: var(--fg-dim);
    font-size: 13px;
  }
  #empty.show { display: flex; }

  #tooltip {
    position: absolute;
    background: rgba(20, 20, 30, 0.95);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 8px;
    font-size: 11px;
    color: var(--fg);
    pointer-events: none;
    display: none;
    white-space: nowrap;
    z-index: 10;
    font-variant-numeric: tabular-nums;
  }
  #tooltip.show { display: block; }
  #tooltip .ts { color: var(--fg-dim); margin-bottom: 4px; }
  #tooltip .row { display: flex; gap: 8px; align-items: center; }
  #tooltip .dot { width: 8px; height: 8px; border-radius: 2px; }
  #tooltip .label { color: var(--fg-dim); width: 56px; }
  #tooltip .val { font-weight: 600; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-left">
      <h2>Usage History</h2>
      <div class="ranges" id="ranges">
        <button type="button" data-secs="auto" class="active">Auto</button>
        <button type="button" data-secs="86400">24h</button>
        <button type="button" data-secs="259200">3d</button>
        <button type="button" data-secs="604800">7d</button>
        <button type="button" data-secs="1209600">14d</button>
      </div>
      <div class="ranges" id="accounts" hidden>
        <button type="button" data-account="this-pc">This PC</button>
        <button type="button" data-account="claude-alt">Claude ALT</button>
        <button type="button" data-account="codex">Codex</button>
      </div>
    </div>
    <div class="legend" id="legend">
      <div class="legend-item"><div class="swatch session"></div>Session</div>
      <div class="legend-item"><div class="swatch weekly"></div>Weekly</div>
      <div class="legend-item"><div class="swatch fable"></div>Fable</div>
    </div>
  </div>
  <div class="canvas-wrap">
    <canvas id="canvas"></canvas>
    <div id="empty">Insufficient data — waiting for more samples.</div>
    <div id="tooltip"></div>
  </div>
</div>

<script>
  const COLORS = {
    session: '#3fb950',
    weekly:  '#e6c832',
    fable:   '#f85149',
    grid:    '#2d3340',
    label:   '#b0b0b0',
  };
  // Each main entry is [ts_epoch_secs, session_pct, weekly_pct, fable_pct].
  // The feed entries add Codex in the fifth slot.
  let mainHistory = [];       // full retained main history from Rust (≤ 14 days)
  let quotaHistory = [];      // full retained GX10 feed history from Rust
  let feedConfigured = false;
  let view = [];              // selected history clipped to the visible range
  let hoverIdx = -1;          // index into `view`, not `history`
  const THIS_PC = 'this-pc';
  const CLAUDE_ALT = 'claude-alt';
  const CODEX = 'codex';
  let accountMode = loadAccountMode();
  // Selected range: 'auto' sizes the span to the window width; otherwise a
  // fixed number of seconds. Default 'auto'.
  let rangeMode = 'auto';
  // Pixels of plot width per day in Auto mode. Tuned so the default ~760px
  // window shows ~1 week, and the span grows to the full 2 weeks (capped by
  // retention) once the window is roughly twice as wide.
  const AUTO_PX_PER_DAY = 92;
  const MAX_RANGE_DAYS  = 14;

  const canvas  = document.getElementById('canvas');
  const ctx     = canvas.getContext('2d');
  const tooltip = document.getElementById('tooltip');
  const emptyEl = document.getElementById('empty');
  const accountsEl = document.getElementById('accounts');
  const legendEl = document.getElementById('legend');

  // Plot geometry — used by both draw() and pickIndex().
  let geom = { padL: 0, padR: 0, padT: 0, padB: 0, gw: 0, gh: 0, t0: 0, tSpan: 1 };

  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  function formatTick(epoch, spanSecs) {
    const d = new Date(epoch * 1000);
    if (spanSecs > 3 * 86400) {
      // Multi-day span: date only, else labels collide.
      return `${pad2(d.getMonth() + 1)}/${pad2(d.getDate())}`;
    }
    if (spanSecs > 86400) {
      return `${pad2(d.getMonth() + 1)}/${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    }
    return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  }

  // Resolve the visible window (seconds) for a given plot width. In Auto mode
  // the span scales with width — ~1 week at the default size, up to 2 weeks
  // when wide — clamped to [1 day, MAX_RANGE_DAYS]. Fixed modes ignore width.
  function effectiveRangeSecs(gw) {
    if (rangeMode === 'auto') {
      const days = Math.max(1, Math.min(MAX_RANGE_DAYS, gw / AUTO_PX_PER_DAY));
      return days * 86400;
    }
    return rangeMode;
  }

  // Clip `history` to `rangeSecs`, measured back from the newest sample (where
  // the plot's right edge sits). history is chronological, so drop a leading
  // run. If the window is wider than the data, everything is returned.
  function clipHistory(history, rangeSecs) {
    if (!history || history.length === 0) return [];
    const cutoff = history[history.length - 1][0] - rangeSecs;
    let i = 0;
    while (i < history.length && history[i][0] < cutoff) i++;
    return history.slice(i);
  }

  function loadAccountMode() {
    try {
      const saved = localStorage.getItem('usage-chart-account');
      if ([THIS_PC, CLAUDE_ALT, CODEX].includes(saved)) return saved;
    } catch (_) {}
    return THIS_PC;
  }

  function selectedAccount() {
    if (accountMode !== THIS_PC && !feedConfigured && quotaHistory.length === 0) return THIS_PC;
    return accountMode;
  }

  function selectedHistory() {
    return selectedAccount() === THIS_PC ? mainHistory : quotaHistory;
  }

  function selectedSeries() {
    if (selectedAccount() === CODEX) {
      return [{ idx: 4, color: COLORS.weekly, label: 'Weekly' }];
    }
    return [
      { idx: 1, color: COLORS.session, label: 'Session' },
      { idx: 2, color: COLORS.weekly, label: 'Weekly' },
      { idx: 3, color: COLORS.fable, label: 'Fable' },
    ];
  }

  function updateAccountUi() {
    const feedAvailable = feedConfigured || quotaHistory.length > 0;
    accountsEl.hidden = !feedAvailable;
    const active = selectedAccount();
    for (const b of accountsEl.querySelectorAll('button[data-account]')) {
      b.classList.toggle('active', b.dataset.account === active);
    }
    legendEl.innerHTML = selectedSeries().map(s =>
      `<div class="legend-item"><div class="swatch" style="background:${s.color}"></div>${s.label}</div>`
    ).join('');
  }

  function feedEmptyText() {
    return selectedAccount() === THIS_PC
      ? null
      : 'No GX10 readings in the selected range yet.';
  }

  function isNumber(value) {
    return typeof value === 'number' && Number.isFinite(value);
  }

  function formatValue(value) {
    return isNumber(value) ? value.toFixed(1) + '%' : '--';
  }

  function formatTooltipTs(epoch) {
    const d = new Date(epoch * 1000);
    return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())} ` +
           `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  }

  function fitCanvas() {
    // Match canvas backing-store to its CSS size × devicePixelRatio so lines
    // stay crisp on hi-DPI monitors.
    const wrap = canvas.parentElement;
    const dpr = window.devicePixelRatio || 1;
    const w = wrap.clientWidth;
    const h = wrap.clientHeight;
    canvas.style.width  = w + 'px';
    canvas.style.height = h + 'px';
    canvas.width  = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function draw() {
    fitCanvas();
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    ctx.clearRect(0, 0, w, h);

    const history = selectedHistory();
    const emptyText = feedEmptyText();
    if (!history || history.length < 2) {
      emptyEl.textContent = emptyText || 'Insufficient data — waiting for more samples.';
      emptyEl.classList.add('show');
      return;
    }

    const padL = 48, padR = 18, padT = 16, padB = 28;
    const gw = w - padL - padR;
    const gh = h - padT - padB;
    if (gw <= 10 || gh <= 10) return;

    // Auto mode sizes the span from gw, so resolve the window now that the
    // plot geometry is known.
    view = clipHistory(history, effectiveRangeSecs(gw));

    if (view.length < 2) {
      // History exists, but the chosen window is too narrow to hold 2 points.
      emptyEl.textContent = emptyText || 'No samples in the selected range yet.';
      emptyEl.classList.add('show');
      hoverIdx = -1;
      return;
    }
    const series = selectedSeries();
    if (!view.some(e => series.some(s => isNumber(e[s.idx])))) {
      emptyEl.textContent = emptyText || 'No samples in the selected range yet.';
      emptyEl.classList.add('show');
      hoverIdx = -1;
      return;
    }
    emptyEl.classList.remove('show');

    const t0    = view[0][0];
    const t1    = view[view.length - 1][0];
    const tSpan = Math.max(1, t1 - t0);
    geom = { padL, padR, padT, padB, gw, gh, t0, tSpan };

    // Horizontal grid + Y labels.
    ctx.strokeStyle = COLORS.grid;
    ctx.lineWidth   = 1;
    ctx.fillStyle   = COLORS.label;
    ctx.font        = '11px "Segoe UI Variable", "Segoe UI", system-ui, sans-serif';
    ctx.textBaseline = 'middle';
    ctx.textAlign    = 'right';
    for (let i = 0; i <= 4; i++) {
      const y = padT + gh * i / 4;
      ctx.beginPath();
      ctx.moveTo(padL, y);
      ctx.lineTo(padL + gw, y);
      ctx.stroke();
      ctx.fillText((100 - i * 25) + '%', padL - 6, y);
    }

    // X-axis: adaptive tick count (~one per 120px) with light vertical
    // gridlines. More ticks keep multi-week spans legible.
    const nSeg = Math.max(2, Math.min(7, Math.round(gw / 120)));
    ctx.strokeStyle  = COLORS.grid;
    ctx.fillStyle    = COLORS.label;
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'top';
    for (let i = 0; i <= nSeg; i++) {
      const x = padL + gw * i / nSeg;
      const t = t0 + tSpan * i / nSeg;
      if (i > 0 && i < nSeg) {
        ctx.beginPath();
        ctx.moveTo(x, padT);
        ctx.lineTo(x, padT + gh);
        ctx.stroke();
      }
      ctx.fillText(formatTick(t, tSpan), x, padT + gh + 6);
    }

    // Plot each series over the visible window.
    for (const s of series) {
      ctx.strokeStyle = s.color;
      ctx.lineWidth   = 2;
      ctx.lineJoin    = 'round';
      ctx.lineCap     = 'round';
      ctx.beginPath();
      let drawing = false;
      for (let i = 0; i < view.length; i++) {
        const ts  = view[i][0];
        const val = view[i][s.idx];
        if (!isNumber(val)) {
          drawing = false;
          continue;
        }
        const x = padL + ((ts - t0) / tSpan) * gw;
        const y = padT + (1 - val / 100) * gh;
        if (!drawing) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        drawing = true;
      }
      ctx.stroke();
    }

    // Hover crosshair + dots.
    if (hoverIdx >= 0 && hoverIdx < view.length) {
      const e = view[hoverIdx];
      const x = padL + ((e[0] - t0) / tSpan) * gw;
      ctx.strokeStyle = 'rgba(255,255,255,0.18)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x, padT);
      ctx.lineTo(x, padT + gh);
      ctx.stroke();
      for (const s of series) {
        if (!isNumber(e[s.idx])) continue;
        const y = padT + (1 - e[s.idx] / 100) * gh;
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.arc(x, y, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function pickIndex(mouseX) {
    if (view.length < 2) return -1;
    const { padL, gw, t0, tSpan } = geom;
    // Linear search over the visible window — bounded by the selected range,
    // so this stays cheap even with a 30-day history on disk.
    let best = 0;
    let bestDist = Infinity;
    for (let i = 0; i < view.length; i++) {
      const x = padL + ((view[i][0] - t0) / tSpan) * gw;
      const d = Math.abs(x - mouseX);
      if (d < bestDist) { bestDist = d; best = i; }
    }
    return bestDist <= 20 ? best : -1;
  }

  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const newIdx = pickIndex(mx);
    if (newIdx !== hoverIdx) {
      hoverIdx = newIdx;
      draw();
    }
    if (hoverIdx >= 0) {
      const en = view[hoverIdx];
      tooltip.innerHTML = `<div class="ts">${formatTooltipTs(en[0])}</div>` +
        selectedSeries().map(s =>
          `<div class="row"><div class="dot" style="background:${s.color}"></div>` +
          `<div class="label">${s.label}</div><div class="val">${formatValue(en[s.idx])}</div></div>`
        ).join('');
      tooltip.classList.add('show');
      // Position tooltip near mouse, but flip sides if near right edge.
      const tw = tooltip.offsetWidth;
      const wrapW = canvas.parentElement.clientWidth;
      let tx = mx + 14;
      if (tx + tw > wrapW - 8) tx = mx - tw - 14;
      tooltip.style.left = tx + 'px';
      tooltip.style.top  = (my + 14) + 'px';
    } else {
      tooltip.classList.remove('show');
    }
  });
  canvas.addEventListener('mouseleave', () => {
    hoverIdx = -1;
    tooltip.classList.remove('show');
    draw();
  });

  window.addEventListener('resize', draw);

  // Range selector — rescale the x-axis without asking Rust for new data.
  document.getElementById('ranges').addEventListener('click', (ev) => {
    const btn = ev.target.closest('button[data-secs]');
    if (!btn) return;
    const v = btn.dataset.secs;
    rangeMode = v === 'auto' ? 'auto' : (parseInt(v, 10) || 'auto');
    for (const b of document.querySelectorAll('#ranges button')) {
      b.classList.toggle('active', b === btn);
    }
    hoverIdx = -1;
    tooltip.classList.remove('show');
    draw();
  });

  accountsEl.addEventListener('click', (ev) => {
    const btn = ev.target.closest('button[data-account]');
    if (!btn) return;
    accountMode = btn.dataset.account;
    try { localStorage.setItem('usage-chart-account', accountMode); } catch (_) {}
    hoverIdx = -1;
    tooltip.classList.remove('show');
    updateAccountUi();
    draw();
  });

  // Rust pushes history here.
  window.applyHistory = function (h) {
    mainHistory = Array.isArray(h) ? h : [];
    updateAccountUi();
    hoverIdx = -1;
    tooltip.classList.remove('show');
    draw();
  };

  // Rust pushes the GX10 history separately, so the main format stays unchanged.
  window.applyQuotaHistory = function (h, configured) {
    quotaHistory = Array.isArray(h) ? h : [];
    feedConfigured = configured === true;
    updateAccountUi();
    hoverIdx = -1;
    tooltip.classList.remove('show');
    draw();
  };

  updateAccountUi();

  // Ask Rust for the initial snapshot the moment we're ready.
  if (window.chrome && window.chrome.webview) {
    window.chrome.webview.postMessage(JSON.stringify({ cmd: 'ready' }));
  }
</script>
</body>
</html>
