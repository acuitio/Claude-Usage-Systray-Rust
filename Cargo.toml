[package]
name        = "claude-usage-systray"
version     = "0.1.0"
edition     = "2021"
description = "Windows system tray widget showing Anthropic Claude usage. Pure Rust + Win32."
license     = "MIT"
publish     = false

[[bin]]
name = "ClaudeUsageSystray"
path = "src/main.rs"

[[bin]]
name = "ClaudeUsageCollector"
path = "src/bin/collector.rs"

[dependencies]
# Raw Win32 FFI bindings — no Param<T> trait machinery, smallest binary.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_Security",
] }

# JSON I/O for config / cache / history / cooldown / credentials.
serde      = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# Synchronous HTTP for the Anthropic usage + OAuth-refresh endpoints. ureq
# uses native-tls by default (SChannel on Windows) — zero extra binary cost
# vs. rustls. No tokio required since it's blocking.
ureq = { version = "2.10", features = ["json"] }

# Optimize for minimum binary size in release.
[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
panic         = "abort"
strip         = true
