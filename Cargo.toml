[package]
name        = "claude-usage-systray"
version     = "0.1.0"
edition     = "2021"
description = "Windows system tray widget showing Anthropic Claude usage. Pure Rust + Win32."
license     = "MIT"
publish     = false

[[bin]]
name = "ClaudeUsageSystray"
path = "src/main.rs"

[dependencies]
# Raw Win32 FFI bindings — no Param<T> trait machinery, smallest binary.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
] }

# JSON I/O for config / cache / history / cooldown / credentials.
serde      = { version = "1", features = ["derive"] }
serde_json = { version = "1" }

# Synchronous HTTP for the Anthropic usage + OAuth-refresh endpoints.
# `default-features = false` drops rustls + webpki-roots (~200 KB of TLS
# root certs in the binary). `native-tls` routes through Windows SChannel
# instead, which is already in the OS at zero binary cost.
ureq = { version = "2.10", default-features = false, features = ["json", "native-tls"] }

# WebView2 host for the dashboard / settings / chart surfaces. Lets us
# render those windows as HTML/CSS instead of raw GDI. WebView2 Runtime
# ships with Windows 11; on older Windows the user installs it once.
wry = { version = "0.45", default-features = false, features = ["protocol"] }

# Optimize for minimum binary size in release.
[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
panic         = "abort"
strip         = true
